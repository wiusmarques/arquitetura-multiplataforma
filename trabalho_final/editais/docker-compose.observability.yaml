# Bloco OBSERVABILITY — projeto compose `editais-observability`.
#
# Os três pilares da aula 4, com o OTel Collector como funil: as aplicações
# só conhecem UM endereço (otel-collector:4318, OTLP HTTP) e ele roteia
#   traces   → Tempo
#   métricas → Prometheus (expostas na :8889 e raspadas de lá)
#   logs     → Loki
# O Grafana enxerga os três backends (datasources provisionados como código,
# em docker/observability/grafana/) e correlaciona tudo pelo traceID.
#
# Sobe/desce junto com o resto pelo Makefile (make up / make down); as
# aplicações funcionam normalmente sem este bloco — a instrumentação só
# ativa quando OTEL_EXPORTER_OTLP_ENDPOINT está definido no ambiente.
name: editais-observability

networks:
  default:
    name: editais
    external: true

volumes:
  obs_prometheus: {}
  obs_loki: {}
  obs_tempo: {}
  obs_grafana: {}

services:

  # ───────────── OTel Collector — o único endereço que os apps conhecem ─────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: editais-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./docker/observability/otel-collector/config.yml:/etc/otelcol/config.yml:ro
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started

  # ───────────── Prometheus — métricas ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: editais-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver   # aceita push do Tempo metrics-generator
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - obs_prometheus:/prometheus
    # Loopback de propósito: o Docker publica portas por fora do firewall;
    # em produção o acesso é só local (ou via túnel SSH) — nunca pelo IP.
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────── Tempo — traces ─────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.4.0
    container_name: editais-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./docker/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - obs_tempo:/var/tempo

  # ───────────── Loki — logs ────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: editais-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./docker/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - obs_loki:/loki

  # ───────────── Grafana — a tela única ─────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: editais-grafana
    restart: unless-stopped
    environment:
      # Default (laboratório): entra direto como admin, sem login. Em
      # PRODUÇÃO, antes de expor grafana.uaiotru.com.br, defina no .env:
      #   GRAFANA_ANONYMOUS=false  e  GRAFANA_ADMIN_PASSWORD=<senha forte>
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_ANONYMOUS:-true}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor correlations
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://grafana.editais.local:3000}
      GF_LOG_FILTERS: "authn.service:error"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - obs_grafana:/var/lib/grafana
    # Loopback: no lab o grafana.editais.local aponta para 127.0.0.1, e em
    # produção quem serve é o nginx (proxy para 127.0.0.1:3000) atrás da
    # Cloudflare — o Grafana nunca fica exposto direto no IP da máquina.
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
